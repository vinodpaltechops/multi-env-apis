environment: dev
replicaCount: 1
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
podDisruptionBudget:
  enabled: false     # single replica would block node drains
topologySpread:
  enabled: false
resources:
  requests: {cpu: 50m,  memory: 128Mi}
  limits:   {cpu: 250m, memory: 256Mi}
