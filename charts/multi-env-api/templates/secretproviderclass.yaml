{{- if include "app.hasSecrets" . }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "app.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
  {{- if .Values.migrations.enabled }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
  {{- end }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: {{ required "workloadIdentity.clientId is required" .Values.workloadIdentity.clientId | quote }}
    keyvaultName: {{ required "keyVault.name is required" .Values.keyVault.name | quote }}
    tenantId: {{ required "keyVault.tenantId is required" .Values.keyVault.tenantId | quote }}
    objects: |
      array:
      {{- range .Values.keyVault.objects }}
        - |
          objectName: {{ .objectName }}
          objectType: {{ .objectType | default "secret" }}
          {{- with .objectAlias }}
          objectAlias: {{ . }}
          {{- end }}
      {{- end }}
{{- end }}
