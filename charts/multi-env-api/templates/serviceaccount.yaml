apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "app.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
  annotations:
    azure.workload.identity/client-id: {{ required "workloadIdentity.clientId is required" .Values.workloadIdentity.clientId | quote }}
    {{- with .Values.workloadIdentity.tenantId }}
    azure.workload.identity/tenant-id: {{ . | quote }}
    {{- end }}
    {{- if .Values.migrations.enabled }}
    # Needed by the pre-install hook Job before regular resources exist.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
    {{- end }}
# Pods get the Workload Identity token from the webhook's projected volume.
automountServiceAccountToken: false
