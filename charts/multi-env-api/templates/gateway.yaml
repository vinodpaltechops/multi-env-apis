{{- if .Values.gateway.enabled }}
{{- $name := include "app.fullname" . }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
  annotations:
    alb.networking.azure.io/alb-id: {{ required "gateway.albId is required" .Values.gateway.albId | quote }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  listeners:
    {{- if .Values.gateway.tls.secretName }}
    - name: https
      port: 443
      protocol: HTTPS
      {{- with .Values.gateway.hostname }}
      hostname: {{ . | quote }}
      {{- end }}
      tls:
        mode: Terminate
        certificateRefs:
          - {kind: Secret, name: {{ .Values.gateway.tls.secretName | quote }}}
      allowedRoutes: {namespaces: {from: Same}}
    {{- else }}
    - name: http
      port: 80
      protocol: HTTP
      {{- with .Values.gateway.hostname }}
      hostname: {{ . | quote }}
      {{- end }}
      allowedRoutes: {namespaces: {from: Same}}
    {{- end }}
  addresses:
    - type: alb.networking.azure.io/alb-frontend
      value: {{ required "gateway.frontendName is required" .Values.gateway.frontendName | quote }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  parentRefs:
    - {name: {{ $name }}}
  {{- with .Values.gateway.hostname }}
  hostnames: [{{ . | quote }}]
  {{- end }}
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - {name: {{ $name }}, port: {{ .Values.service.port }}}
---
apiVersion: alb.networking.azure.io/v1
kind: HealthCheckPolicy
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  targetRef:
    group: ""
    kind: Service
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
  default:
    interval: {{ .Values.gateway.healthCheck.interval }}
    timeout: {{ .Values.gateway.healthCheck.timeout }}
    healthyThreshold: 1
    unhealthyThreshold: 2
    http:
      path: {{ .Values.gateway.healthCheck.path }}
      match:
        statusCodes:
          - start: 200
            end: 200
{{- end }}
