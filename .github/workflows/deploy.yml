name: Deploy (reusable)

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub Environment / target (dev, staging, prod)
        type: string
        required: true
      digest:
        description: Image digest to deploy (sha256:...)
        type: string
        required: true
      run_dast:
        description: Run OWASP ZAP baseline scan after the smoke test
        type: boolean
        required: false
        default: false

permissions: {}

# Two deploys to the same environment never overlap; queued deploys wait.
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

env:
  IMAGE_NAME: multi-env-api
  RELEASE: multi-env-api
  CHART: charts/multi-env-api

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    # Per-environment variables, OIDC subject and (for prod) required reviewers.
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write # OIDC federation to Azure
    env:
      TARGET_ENV: ${{ inputs.environment }}
      DIGEST: ${{ inputs.digest }}
      IMAGE_REPO: ${{ vars.ACR_LOGIN_SERVER }}/multi-env-api
      NAMESPACE: ${{ vars.K8S_NAMESPACE || format('multi-env-api-{0}', inputs.environment) }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - name: Validate inputs
        run: |
          [[ "$TARGET_ENV" =~ ^(dev|staging|prod)$ ]] || { echo "invalid environment"; exit 1; }
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "invalid digest"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Azure login (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set AKS context
        uses: azure/aks-set-context@883bdc8d8d1d0fd87e66cc4ba6f0b618f9eb5281 # v5.0.1
        with:
          resource-group: ${{ vars.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ vars.AKS_CLUSTER }}
          use-kubelogin: "true"

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.0

      # Refuse to deploy anything that was not built and signed by cicd.yml on main.
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Verify image signature
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
          REPO: ${{ github.repository }}
        run: |
          az acr login --name "$ACR_NAME"
          cosign verify "${IMAGE_REPO}@${DIGEST}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/${REPO}/.github/workflows/cicd.yml@refs/heads/main" \
            > /dev/null

      - name: Helm upgrade
        env:
          WI_CLIENT_ID: ${{ vars.WORKLOAD_IDENTITY_CLIENT_ID }}
          TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          DB_SERVER: ${{ vars.DB_SERVER }}
          DB_NAME: ${{ vars.DB_NAME }}
          ALB_ID: ${{ vars.ALB_ID }}
          AGC_FRONTEND: ${{ vars.AGC_FRONTEND }}
          APP_HOSTNAME: ${{ vars.APP_HOSTNAME }}
          AGC_SUBNET_CIDR: ${{ vars.AGC_SUBNET_CIDR }}
          TLS_SECRET_NAME: ${{ vars.TLS_SECRET_NAME }}
          KEYVAULT_NAME: ${{ vars.KEYVAULT_NAME }}
        run: |
          args=(
            --namespace "$NAMESPACE"
            -f "$CHART/values-${TARGET_ENV}.yaml"
            --set "image.repository=${IMAGE_REPO}"
            --set "image.digest=${DIGEST}"
            --set "workloadIdentity.clientId=${WI_CLIENT_ID}"
            --set "workloadIdentity.tenantId=${TENANT_ID}"
            --set "app.db.server=${DB_SERVER}"
            --set "app.db.name=${DB_NAME}"
            --set "gateway.albId=${ALB_ID}"
            --set "gateway.frontendName=${AGC_FRONTEND}"
            --set "gateway.hostname=${APP_HOSTNAME}"
            --set "networkPolicy.ingressCidrs[0]=${AGC_SUBNET_CIDR}"
          )
          if [ -n "$TLS_SECRET_NAME" ]; then args+=(--set "gateway.tls.secretName=${TLS_SECRET_NAME}"); fi
          if [ -n "$KEYVAULT_NAME" ]; then
            args+=(--set "keyVault.name=${KEYVAULT_NAME}" --set "keyVault.tenantId=${TENANT_ID}")
          fi
          helm upgrade --install "$RELEASE" "$CHART" "${args[@]}" \
            --atomic --wait --timeout 10m --history-max 10

      - name: Smoke test (readiness endpoint)
        run: |
          for i in $(seq 1 30); do
            if curl -fsS --max-time 5 "${APP_URL}/readyz"; then echo; echo "ready"; exit 0; fi
            echo "attempt $i: not ready yet"; sleep 10
          done
          echo "::error::${APP_URL}/readyz did not become ready"; exit 1

      - name: OWASP ZAP baseline scan
        if: ${{ inputs.run_dast }}
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ vars.APP_URL }}
          fail_action: false # gating on high-risk alerts is done below
          allow_issue_writing: false

      - name: Fail on high-risk ZAP alerts
        if: ${{ inputs.run_dast }}
        run: |
          high=$(jq '[.site[].alerts[] | select(.riskcode == "3")] | length' report_json.json)
          echo "high-risk alerts: $high"
          [ "$high" -eq 0 ]
